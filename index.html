<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Leitor QR</title>


  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    body {

      font-family: Arial;

      background: #f4f4f9;

      margin: 0;

      padding: 20px;

      text-align: center;

    }


    .card {

      max-width: 500px;

      margin: auto;

      background: white;

      padding: 20px;

      border-radius: 15px;

    }


    #reader {

      width: 100%;

      margin-top: 20px;

    }


    #resultado {

      margin-top: 20px;

      font-weight: bold;

    }

  </style>

</head>


<body>


<div class="card">

  <h2>Leitor QR Code</h2>

  <p>
    Aponte a câmera para o equipamento.
  </p>


  <div id="reader"></div>


  <div id="resultado"></div>

</div>


<script>


var scanner =
  new Html5Qrcode("reader");


var jaLido =
  false;


function enviarResultado(codigo) {

  if (jaLido) return;

  jaLido = true;


  document
    .getElementById(
      "resultado"
    )
    .innerText =
    "Equipamento: " + codigo;


  scanner
    .stop()
    .then(function() {

      window.opener.postMessage(

        {
          tipo:
            "QR_EQUIPAMENTO",

          codigo:
            codigo
        },

        "*"

      );


      setTimeout(
        function() {

          window.close();

        },
        500
      );

    })

    .catch(function() {

      window.opener.postMessage(

        {
          tipo:
            "QR_EQUIPAMENTO",

          codigo:
            codigo
        },

        "*"

      );

    });

}


scanner.start(

  {
    facingMode:
      "environment"
  },


  {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    }

  },


  function(decodedText) {

    enviarResultado(
      decodedText
    );

  },


  function(errorMessage) {

    // Ignora erros durante a procura.

  }

)


.catch(function(error) {

  document
    .getElementById(
      "resultado"
    )
    .innerText =
    "Não foi possível acessar a câmera. " +
    "Verifique a permissão da câmera.";

});

</script>


</body>

</html>
