<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Leitor QR</title>


  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    body {

      margin: 0;

      padding: 20px;

      font-family: Arial, sans-serif;

      background: #111;

      color: white;

      text-align: center;

    }


    h2 {

      margin-top: 10px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: 20px auto;

    }


    #resultado {

      font-size: 20px;

      font-weight: bold;

      margin-top: 20px;

    }


    .btn {

      width: 100%;

      max-width: 400px;

      padding: 15px;

      border: none;

      border-radius: 8px;

      background: #28a745;

      color: white;

      font-size: 18px;

      font-weight: bold;

    }

  </style>

</head>


<body>


<h2>📷 Leitor QR Code</h2>


<div id="reader"></div>


<div id="resultado">
  Aponte a câmera para o QR Code
</div>


<br>


<button
  class="btn"
  onclick="fecharLeitor()"
>
  ✓ Terminei
</button>


<script>


var codigosLidos =
  new Set();


var ultimoCodigo =
  "";


var ultimoTempo =
  0;


var scanner =
  new Html5Qrcode(
    "reader",
    {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ]
    }
  );


function quandoLer(codigo) {

  codigo =
    String(codigo)
      .trim()
      .toUpperCase();


  if (!codigo) {
    return;
  }


  var agora =
    Date.now();


  if (
    codigo === ultimoCodigo &&
    agora - ultimoTempo < 1500
  ) {

    return;
  }


  ultimoCodigo =
    codigo;


  ultimoTempo =
    agora;


  if (
    codigosLidos.has(codigo)
  ) {

    document
      .getElementById("resultado")
      .innerText =
      "⚠️ Já lido: " + codigo;

    return;
  }


  codigosLidos.add(codigo);


  document
    .getElementById("resultado")
    .innerText =
    "✅ Lido: " + codigo;


  if (window.opener) {

    window.opener.postMessage(

      {
        tipo:
          "QR_EQUIPAMENTO",

        codigo:
          codigo
      },

      "*"
    );
  }

}


scanner.start(

  {
    facingMode: "environment"
  },

  {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    }

  },

  function(decodedText) {

    quandoLer(
      decodedText
    );

  },

  function(errorMessage) {

  }

)

.catch(function(error) {

  document
    .getElementById("resultado")
    .innerText =
    "❌ Não foi possível abrir a câmera.";

});


function fecharLeitor() {

  scanner
    .stop()
    .then(function() {

      window.close();

    })

    .catch(function() {

      window.close();

    });

}

</script>


</body>

</html>
